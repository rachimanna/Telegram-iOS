name: AyuGram iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [ ayugram ]
    paths-ignore:
      - '**.md'

concurrency:
  group: ayugram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Set repository secrets TG_API_ID and TG_API_HASH (https://my.telegram.org/apps)"
            exit 1
          fi

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "::warning::Xcode $XCODE_VERSION not found, building with the default Xcode"
            echo "OVERRIDE_XCODE=1" >> $GITHUB_ENV
          fi
          xcodebuild -version
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules || true
          # Resolve symlinks so the real directory of the selected Xcode is never deleted.
          ACTIVE="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for x in /Applications/Xcode_*.app; do
            if [ "$x" != "$ACTIVE" ] && [ ! -L "$x" ]; then sudo rm -rf "$x" || true; fi
          done
          # Third-party builds (dav1d meson crossfiles) hardcode /Applications/Xcode.app,
          # so make sure it points at the selected Xcode.
          if [ -L /Applications/Xcode.app ] || [ ! -e /Applications/Xcode.app ]; then
            sudo rm -f /Applications/Xcode.app
            sudo ln -s "$ACTIVE" /Applications/Xcode.app
          fi
          ls -la /Applications | grep -i xcode
          ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/
          df -h /

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          # bundle_id / team_id must match build-system/fake-codesigning profiles.
          # Sideloading tools (ESign, KSign, Scarlet, LiveContainer, AltStore, Sideloadly) re-sign with your own id.
          python3 - <<'EOF'
          import json, os
          config = json.load(open("build-system/appstore-configuration.json"))
          config["api_id"] = os.environ["TG_API_ID"].strip()
          config["api_hash"] = os.environ["TG_API_HASH"].strip()
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"
          config["premium_iap_product_id"] = ""
          json.dump(config, open("build-system/ayugram-configuration.json", "w"), indent=2)
          EOF

      - name: Build
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_ayugram"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER="$(($(git rev-list --count HEAD)+BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          EXTRA=""
          if [ "$OVERRIDE_XCODE" = "1" ]; then
            EXTRA="--overrideXcodeVersion"
          fi

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            $EXTRA \
            build \
            --configurationPath="build-system/ayugram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          # Bazel reports the output as bazel-bin/Telegram/Telegram.ipa (a symlink into bazel-out).
          cp -L bazel-bin/Telegram/Telegram.ipa "$OUTPUT_PATH/AyuGram-$APP_VERSION-$BUILD_NUMBER.ipa"
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/*.ipa
          if-no-files-found: error
